# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: promptdock
      POSTGRES_PASSWORD: promptdock
      POSTGRES_DB: promptdock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptdock"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
