# Local development.
#   docker compose up -d                    Postgres only (for tests and the library)
#   docker compose --profile server up -d   Postgres + PromptDock server and dashboard on :8000
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: promptdock
      POSTGRES_PASSWORD: promptdock
      POSTGRES_DB: promptdock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptdock"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    profiles: ["server"]
    build: .
    environment:
      DATABASE_URL: postgresql://promptdock:promptdock@postgres:5432/promptdock
      PROMPTDOCK_TOKEN: ${PROMPTDOCK_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
