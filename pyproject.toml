[project]
name = "promptdock"
version = "0.1.0"
description = "Focused prompt versioning: immutable versions, movable tags, eval-gated promotion."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Shreya Mhetre" },
    { name = "Parth" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "jinja2>=3.1",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
ui = ["promptdock[server]"]
mcp = ["mcp>=2.3,<3"]
all = ["promptdock[server,ui,mcp]"]
dev = [
    "promptdock[all]",
    "pytest>=8",
    "testcontainers[postgres]>=4",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml",
    "pre-commit>=3.7",
]

[project.scripts]
promptdock = "promptdock.cli:app"

[project.urls]
Homepage = "https://github.com/shreyamhetre/PromptDock"
Repository = "https://github.com/shreyamhetre/PromptDock"
Issues = "https://github.com/shreyamhetre/PromptDock/issues"
Changelog = "https://github.com/shreyamhetre/PromptDock/blob/main/CHANGELOG.md"

# `uv sync` installs the dev group by default, which pulls in the `dev` extra.
[dependency-groups]
dev = ["promptdock[dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The built dashboard is git-ignored (it is generated by `npm run build` in ui/) but must
# ship inside the wheel and sdist.
artifacts = ["src/promptdock/ui/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/promptdock"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
